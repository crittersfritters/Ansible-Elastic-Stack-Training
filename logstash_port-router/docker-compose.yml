services:
  logstash_port-router:
    image: docker.elastic.co/logstash/logstash:9.2.8
    container_name: logstash_port-router
    network_mode: host
    restart: unless-stopped
    extra_hosts:
      - "kafka.local:127.0.0.1"
    environment:
      MISSION_EVENT_TIMEZONE: "${MISSION_EVENT_TIMEZONE:-UTC}"
    volumes:
      - "./pipeline:/usr/share/logstash/pipeline:ro,Z"
      - "./config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro,Z"
      - "./config/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro,Z"
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:9601/_node/pipelines/logstash_port-router
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 20s
