services:
  logstash_pipeline:
    image: docker.elastic.co/logstash/logstash:9.2.8
    container_name: logstash_pipeline
    network_mode: host
    restart: unless-stopped
    extra_hosts:
      - "elasticsearch.local:127.0.0.1"
      - "kafka.local:127.0.0.1"
    volumes:
      - "./pipeline:/usr/share/logstash/pipeline:ro,Z"
      - "./config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro,Z"
      - "./config/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro,Z"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://127.0.0.1:9600/_node/pipelines/zeek >/dev/null
          && curl -fsS http://127.0.0.1:9600/_node/pipelines/suricata >/dev/null
          && curl -fsS http://127.0.0.1:9600/_node/pipelines/grok_pipeline >/dev/null
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 20s
