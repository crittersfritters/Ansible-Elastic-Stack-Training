---
- name: Wait for the Kafka broker health check
  ansible.builtin.include_tasks:
    file: "{{ common_tasks_path }}/wait_for_container_health.yml"
  vars:
    common_healthcheck_container_name: kafka
    common_healthcheck_delegate: "{{ groups['queue_nodes'] | first }}"
    common_healthcheck_retries: 48
    common_healthcheck_delay: 5

- name: Verify the required Kafka topics are available
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - kafka
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - 127.0.0.1:9092
      - --list
  register: common_kafka_topic_list_result
  until:
    - common_kafka_topic_list_result.rc == 0
    - >-
      required_kafka_topics
      | difference(common_kafka_topic_list_result.stdout_lines | default([]))
      | length == 0
  retries: 24
  delay: 5
  changed_when: false
  become: true
  delegate_to: "{{ groups['queue_nodes'] | first }}"
