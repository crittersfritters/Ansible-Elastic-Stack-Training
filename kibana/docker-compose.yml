services:
  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.8
    container_name: kibana
    network_mode: host
    restart: unless-stopped
    extra_hosts:
      - "elasticsearch.local:127.0.0.1"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch.local:9200
      SERVER_HOST: 127.0.0.1
    volumes:
      - "./data:/usr/share/kibana/data:Z"
