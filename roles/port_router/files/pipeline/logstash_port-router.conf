input {
  tcp {
    host => "127.0.0.1"
    port => 4444
    # Mission records are newline-delimited. The line codec gives the TCP byte
    # stream an explicit record boundary before Grok sees each event.
    codec => line
    add_field => {
      "log_source" => "Mission-Agg-HC2"
      "system" => "mission_system_3"
    }
  }
}

filter {
  # Preserve the raw source record before any parser modifies the event.
  if [message] and ![event][original] {
    mutate {
      copy => {
        "message" => "[event][original]"
      }
    }
  }

  # Preserve Logstash's first-seen time before the shared Date filter replaces
  # @timestamp with the authoritative time carried by the external event.
  if ![event][created] {
    mutate {
      copy => {
        "@timestamp" => "[event][created]"
      }
    }
  }

  # -------------------------------------------------------------------------
  # Parser contract:
  # - The first parser runs unconditionally.
  # - A normal nonmatch adds Grok's default _grokparsefailure tag.
  # - A timeout adds Grok's default _groktimeout tag and stops the chain.
  # - A successful parser removes _grokparsefailure, sets visible parser
  #   identity, and selects its Elasticsearch alias in @metadata.
  # -------------------------------------------------------------------------
  grok {
    pattern_definitions => {
      "CSVFIELD" => "[^,]*"
      "PAN_TIMESTAMP" => "[0-9]{4}/[0-9]{2}/[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}(?:[.][0-9]{3})?"
    }
    match => {
      "message" => "\A%{CSVFIELD},%{PAN_TIMESTAMP},%{NONNEGINT:[observer][serial_number]},%{CSVFIELD:[paloalto][type]},%{CSVFIELD:[paloalto][subtype]},%{CSVFIELD},%{PAN_TIMESTAMP:[@metadata][timestamps][event]},%{IP:[source][ip]},%{IP:[destination][ip]},%{IP:[source][nat][ip]},%{IP:[destination][nat][ip]},%{CSVFIELD:[rule][name]},%{CSVFIELD:[source][user][name]},%{CSVFIELD:[destination][user][name]},%{CSVFIELD:[network][application]},%{CSVFIELD:[paloalto][virtual_system][id]},%{CSVFIELD:[observer][ingress][zone]},%{CSVFIELD:[observer][egress][zone]},%{CSVFIELD:[observer][ingress][interface][name]},%{CSVFIELD:[observer][egress][interface][name]},%{CSVFIELD:[paloalto][log_forwarding_profile]},%{CSVFIELD},%{NONNEGINT:[paloalto][session][id]},%{NONNEGINT:[paloalto][repeat_count]:int},%{NONNEGINT:[source][port]:int},%{NONNEGINT:[destination][port]:int},%{NONNEGINT:[source][nat][port]:int},%{NONNEGINT:[destination][nat][port]:int},%{CSVFIELD:[paloalto][session][flags]},%{WORD:[network][transport]},%{CSVFIELD:[event][action]},%{NONNEGINT:[network][bytes]:int},%{NONNEGINT:[source][bytes]:int},%{NONNEGINT:[destination][bytes]:int},%{NONNEGINT:[network][packets]:int},%{PAN_TIMESTAMP:[paloalto][session][start_time]},%{NONNEGINT:[paloalto][elapsed_seconds]:int},%{CSVFIELD:[paloalto][url][category]},%{CSVFIELD},%{NONNEGINT:[event][sequence]:int},%{CSVFIELD:[paloalto][action][flags]},%{CSVFIELD:[source][geo][country_name]},%{CSVFIELD:[destination][geo][country_name]},%{CSVFIELD},%{NONNEGINT:[source][packets]:int},%{NONNEGINT:[destination][packets]:int},%{CSVFIELD:[paloalto][session][end_reason]},%{NONNEGINT:[paloalto][device_group][level_1]},%{NONNEGINT:[paloalto][device_group][level_2]},%{NONNEGINT:[paloalto][device_group][level_3]},%{NONNEGINT:[paloalto][device_group][level_4]},%{CSVFIELD:[paloalto][virtual_system][name]},%{CSVFIELD:[observer][hostname]},%{CSVFIELD:[paloalto][action_source]},%{CSVFIELD:[paloalto][source][vm_uuid]},%{CSVFIELD:[paloalto][destination][vm_uuid]},%{CSVFIELD:[paloalto][tunnel_id_or_imsi]},%{CSVFIELD:[paloalto][monitor_tag_or_imei]},%{CSVFIELD:[paloalto][parent_session][id]},%{CSVFIELD:[paloalto][parent_session][start_time]},%{CSVFIELD:[paloalto][tunnel][type]}\z"
    }
    # Common add_field options run only after this Grok instance succeeds.
    add_field => {
      # Visible parser identity supports false-positive investigation.
      "[_parser][id]" => "pan_full"
      "[_parser][version]" => "1"
      # The producer owns routing. @metadata is not included in the JSON body.
      "[@metadata][routing][target_index]" => "active-grok-match"
    }
    # On success, remove_tag clears any prior _grokparsefailure baton.
    # tag_on_failure and tag_on_timeout intentionally use Grok's defaults.
    remove_tag => [ "_grokparsefailure" ]
    timeout_scope => "event"
  }

  # -------------------------------------------------------------------------
  # Pattern 2
  # -------------------------------------------------------------------------
  if "_grokparsefailure" in [tags] and
     "_groktimeout" not in [tags] {
    grok {
      pattern_definitions => {
        "CSVFIELD" => "[^,]*"
      }
      match => {
        "message" => "\A%{TIMESTAMP_ISO8601:[@metadata][timestamps][event]},%{CSVFIELD:[paloalto][type]},%{CSVFIELD:[event][action]},%{IP:[source][ip]},%{IP:[destination][ip]},%{NONNEGINT:[source][port]:int},%{NONNEGINT:[destination][port]:int},%{CSVFIELD:[observer][ingress][zone]},%{CSVFIELD:[observer][egress][zone]},%{CSVFIELD:[rule][name]},%{WORD:[network][transport]},%{NONNEGINT:[source][bytes]:int},%{NONNEGINT:[destination][bytes]:int},%{NONNEGINT:[source][packets]:int},%{NONNEGINT:[destination][packets]:int},%{NONNEGINT:[paloalto][session][id]},%{CSVFIELD:[paloalto][session][flags]}\z"
      }
      add_field => {
        "[_parser][id]" => "pan_simple"
        "[_parser][version]" => "1"
        "[@metadata][routing][target_index]" => "active-grok-match"
      }
      remove_tag => [ "_grokparsefailure" ]
      timeout_scope => "event"
    }
  }

  # -------------------------------------------------------------------------
  # Use below section as a template for new parser additions
  # -------------------------------------------------------------------------
  #
  #if "_grokparsefailure" in [tags] and
  #   "_groktimeout" not in [tags] {
  #  grok {
  #    match => {
  #      "message" => "\A[TEMPLATE]\z"
  #    }
  #    add_field => {
  #      "[_parser][id]" => "[TEMPLATE]"
  #      "[_parser][version]" => "[TEMPLATE]"
  #      "[@metadata][routing][target_index]" => "[TEMPLATE]"
  #    }
  #    remove_tag => [ "_grokparsefailure" ]
  #    timeout_scope => "event"
  #  }
  #}

  # -------------------------------------------------------------------------
  # Normalize event time after a parser successfully claims the record.
  # -------------------------------------------------------------------------
  if "_grokparsefailure" not in [tags] and
     "_groktimeout" not in [tags] {

    if [@metadata][timestamps][event] {
      date {
        match => [
          "[@metadata][timestamps][event]",
          "yyyy/MM/dd HH:mm:ss.SSS",
          "yyyy/MM/dd HH:mm:ss",
          "yyyy-MM-dd HH:mm:ss.SSS",
          "yyyy-MM-dd HH:mm:ss",
          "ISO8601"
        ]
        target => "@timestamp"
        timezone => "${MISSION_EVENT_TIMEZONE:UTC}"

        # Invalid values receive _dateparsefailure by default.
      }
    } else {
      # The parser matched but did not provide the required timestamp.
      mutate {
        add_tag => [ "_dateparsefailure" ]
      }
    }
  }

  # -------------------------------------------------------------------------
  # Consolidated failure route.
  #
  # Any Grok nonmatch, Grok timeout, missing timestamp, or Date failure uses
  # active-unparsed. Date failures retain the parser that matched structurally.
  # -------------------------------------------------------------------------
  if "_grokparsefailure" in [tags] or
     "_groktimeout" in [tags] or
     "_dateparsefailure" in [tags] {

    mutate {
      replace => {
        "[@metadata][routing][target_index]" => "active-unparsed"
      }
    }

    if ![_parser][id] {
      mutate {
        add_field => {
          "[_parser][id]" => "unmatched"
          "[_parser][version]" => "1"
        }
      }
    }
  }

  # Remove backend control tags and Logstash's internal event version after
  # routing is complete. Unrelated source tags remain intact.
  mutate {
    remove_tag => [
      "_grokparsefailure",
      "_groktimeout",
      "_dateparsefailure"
    ]
    remove_field => [ "@version" ]
  }
}

output {
  kafka {
    bootstrap_servers => "kafka.local:9092"
    topic_id => "mission-group"
    codec => "json"
    # @metadata is omitted from the JSON body. Only the downstream routing
    # alias crosses Kafka as a record header. _parser.id and _parser.version stay
    # visible in the JSON event for troubleshooting false-positive matches.
    message_headers => {
      "target_index" => "%{[@metadata][routing][target_index]}"
    }
  }
}
