input {
  kafka {
    bootstrap_servers => "kafka.local:9092"
    topics => ["suricata-group"]
    group_id => "suricata-group"
    auto_offset_reset => "earliest"
    codec => "json"
  }
}

filter {
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
  mutate {
    add_field => { "logstash_pipeline" => "suricata_pipeline" }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch.local:9200"]
    index => "active-suricata"
    data_stream => false
    ilm_enabled => false
    manage_template => false
  }
}
