input {
  kafka {
    bootstrap_servers => "kafka.local:9092"
    topics => ["mission-group"]
    group_id => "mission-group"
    auto_offset_reset => "earliest"
    codec => "json"

    # Expose the producer's target_index record header under @metadata.
    decorate_events => "extended"
  }
}

filter {
  # The JSON codec creates a new Logstash event and can restore @version.
  # Remove it again before the mission document is indexed.
  mutate {
    remove_field => [ "@version" ]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch.local:9200"]

    # Each successful producer parser chooses its own destination alias.
    # Every producer parsing failure uses active-unparsed.
    index => "%{[@metadata][kafka][headers][target_index]}"
    data_stream => false
    ilm_enabled => false
    manage_template => false
  }
}
