---
- name: Verify Docker participates in host SELinux confinement
  ansible.builtin.include_tasks:
    file: "{{ common_tasks_path }}/verify_docker_selinux.yml"

- name: Wait for Kafka and the required topics before deploying Zeek Filebeat
  ansible.builtin.include_tasks:
    file: "{{ common_tasks_path }}/wait_for_kafka.yml"

- name: Verify the Zeek log directory exists
  ansible.builtin.stat:
    path: "{{ zeek_logs_dir }}"
    follow: true
  register: filebeat_zeek_log_directory_result
  become: true

- name: Require the Zeek log directory to be available
  ansible.builtin.assert:
    that:
      - filebeat_zeek_log_directory_result.stat.exists
      - filebeat_zeek_log_directory_result.stat.isdir
    fail_msg: "Zeek log directory {{ zeek_logs_dir }} does not exist or is not a directory."

- name: Resolve the stable Zeek log root
  ansible.builtin.command:
    argv:
      - readlink
      - --canonicalize-existing
      - --
      - "{{ zeek_logs_root }}"
  register: filebeat_zeek_resolved_logs_root_result
  changed_when: false
  check_mode: false
  become: true

- name: Resolve the active Zeek log directory
  ansible.builtin.command:
    argv:
      - readlink
      - --canonicalize-existing
      - --
      - "{{ zeek_logs_dir }}"
  register: filebeat_zeek_resolved_logs_dir_result
  changed_when: false
  check_mode: false
  become: true

- name: Require safe canonical Zeek log paths
  ansible.builtin.assert:
    that:
      - filebeat_zeek_resolved_logs_root_result.stdout | length > 0
      - filebeat_zeek_resolved_logs_dir_result.stdout | length > 0
      - filebeat_zeek_resolved_logs_root_result.stdout.startswith('/')
      - filebeat_zeek_resolved_logs_dir_result.stdout.startswith('/')
      - filebeat_zeek_resolved_logs_root_result.stdout != '/'
      - filebeat_zeek_resolved_logs_dir_result.stdout != '/'
    fail_msg: >-
      Zeek log paths must resolve to existing absolute directories other than
      the host root.

- name: Record the canonical Zeek log paths
  ansible.builtin.set_fact:
    filebeat_zeek_resolved_logs_root: >-
      {{ filebeat_zeek_resolved_logs_root_result.stdout }}
    filebeat_zeek_resolved_logs_dir: >-
      {{ filebeat_zeek_resolved_logs_dir_result.stdout }}

- name: Select any external Zeek active-log mount
  ansible.builtin.set_fact:
    filebeat_zeek_external_log_mounts: >-
      {{
        []
        if (
          filebeat_zeek_resolved_logs_dir
          == filebeat_zeek_resolved_logs_root
          or filebeat_zeek_resolved_logs_dir.startswith(
            filebeat_zeek_resolved_logs_root.rstrip('/') ~ '/'
          )
        )
        else [filebeat_zeek_resolved_logs_dir]
      }}

- name: Create the Zeek Filebeat project directory
  ansible.builtin.file:
    path: "{{ filebeat_zeek_folder_path }}"
    state: directory
    mode: "0750"
    owner: root
    group: docker
  become: true

- name: Create the persistent Zeek Filebeat registry directory
  ansible.builtin.file:
    path: "{{ filebeat_zeek_folder_path }}/data"
    state: directory
    mode: "0750"
    owner: root
    group: root
  become: true

- name: Render the Zeek Filebeat configuration
  ansible.builtin.template:
    src: "{{ project_root }}/roles/filebeat_zeek/templates/filebeat.yml.j2"
    dest: "{{ filebeat_zeek_folder_path }}/filebeat.yml"
    mode: "0644"
    owner: root
    group: root
  register: filebeat_zeek_config_result
  become: true

- name: Render the Zeek Filebeat Docker Compose definition
  ansible.builtin.include_tasks:
    file: "{{ common_tasks_path }}/update_from_template.yml"
  vars:
    common_compose_template_source: >-
      {{ project_root }}/roles/filebeat_zeek/templates/docker-compose.yml.j2
    common_compose_project_path: "{{ filebeat_zeek_folder_path }}"

- name: Deploy the Zeek Filebeat Compose project
  ansible.builtin.include_tasks:
    file: "{{ common_tasks_path }}/deploy_compose.yml"
  vars:
    common_compose_project_path: "{{ filebeat_zeek_folder_path }}"
    common_compose_external_config_changed: >-
      {{ filebeat_zeek_config_result.changed }}
    common_compose_external_config_requires_recreate: true

- name: Confirm the Zeek Filebeat configuration is healthy
  ansible.builtin.include_tasks:
    file: "{{ common_tasks_path }}/wait_for_container_health.yml"
  vars:
    common_healthcheck_container_name: "{{ filebeat_zeek_container_name }}"
    common_healthcheck_retries: 24
    common_healthcheck_delay: 5

- name: Verify the Zeek log mount is readable inside Filebeat
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ filebeat_zeek_container_name }}"
      - /bin/sh
      - -ec
      - |
        set -eu
        found=0
        for log_path in "$1"/*.log; do
          [ -f "$log_path" ] || continue
          [ -s "$log_path" ] || continue
          head -c 1 "$log_path" >/dev/null
          found=1
        done
        [ "$found" -eq 1 ]
      - sh
      - "{{ filebeat_zeek_resolved_logs_dir }}"
  changed_when: false
  become: true
