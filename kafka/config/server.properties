# Cluster settings
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@127.0.0.1:9093
controller.listener.names=CONTROLLER
log.dirs=/var/lib/kafka/data

# Listener settings
listeners=CONTROLLER://127.0.0.1:9093,PLAINTEXT://127.0.0.1:9092
advertised.listeners=PLAINTEXT://kafka.local:9092
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
inter.broker.listener.name=PLAINTEXT

# Topic settings
num.partitions=1
offsets.topic.replication.factor=1
transaction.state.log.min.isr=1
transaction.state.log.replication.factor=1
auto.create.topics.enable=false
# Retention uses broker arrival time; source event time remains in the JSON
# document's @timestamp field for Elasticsearch and Kibana.
log.message.timestamp.type=LogAppendTime
