services:
  kafka:
    image: apache/kafka:3.9.2
    container_name: kafka
    network_mode: host
    restart: unless-stopped
    extra_hosts:
      - "kafka.local:127.0.0.1"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - "./data:/var/lib/kafka/data:Z"
      - "./config:/mnt/shared/config:ro,Z"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/kafka/bin/kafka-topics.sh
          --bootstrap-server 127.0.0.1:9092
          --list >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    network_mode: host
    restart: unless-stopped
    extra_hosts:
      - "kafka.local:127.0.0.1"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka.local:9092
      SERVER_ADDRESS: 127.0.0.1

  kafka-topics-init:
    image: apache/kafka:3.9.2
    container_name: kafka-topics-init
    network_mode: host
    restart: "no"
    extra_hosts:
      - "kafka.local:127.0.0.1"
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        export PATH="$$PATH:/opt/kafka/bin"
        attempts=0
        until kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1; do
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 60 ]; then
            echo "Kafka did not become ready after 300 seconds" >&2
            exit 1
          fi
          sleep 5
        done
        kafka-topics.sh --create --if-not-exists --bootstrap-server 127.0.0.1:9092 --topic zeek-group --partitions 1 --replication-factor 1
        kafka-topics.sh --create --if-not-exists --bootstrap-server 127.0.0.1:9092 --topic suricata-group --partitions 1 --replication-factor 1
        kafka-topics.sh --create --if-not-exists --bootstrap-server 127.0.0.1:9092 --topic mission-group --partitions 1 --replication-factor 1
